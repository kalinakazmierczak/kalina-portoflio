    <!-- Resolve the theme before first paint. Inline and synchronous on
         purpose: deferring this to React guarantees a light flash on a dark
         machine. Only writes the attribute when there's an explicit stored
         choice — otherwise CSS prefers-color-scheme decides. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          if (saved === 'light' || saved === 'dark') {
            document.documentElement.setAttribute('data-theme', saved);
          }
        } catch (e) {
          /* private mode / storage disabled — fall through to the OS setting */
        }
      })();
    </script>
